simulator:
  map: XTOC
  traffic_density: 0.0
  random_traffic: false
  traffic_mode: trigger
  obstacle_probability: 0.0
  num_scenarios: 1
  start_seed: 0
  decision_repeat: 5
  physics_world_step_size: 0.02
  horizon: 300
  use_lidar: true
  headless: true
  manual_control: false
  realtime: true
  # Half-speed simulation gives the cloud model two wall seconds per sim second.
  realtime_factor: 0.5
  out_of_road_done: false
  crash_vehicle_done: false
  crash_object_done: false

camera:
  enabled: true
  width: 512
  height: 288

display:
  speed_unit: mps

vla:
  enabled: true
  prompt_policy: >-
    On a clear lane, prefer the cruise speed. Reduce target speed for visible
    hazards, uncertainty, road geometry, or traffic controls; use 0 only when a
    full stop is intended. Maintain safe forward progress. When
    LOCAL_SCENE_CONTEXT confirms that a stationary lead blocks the current lane
    and an adjacent lane is available and observed clear, prefer changing into
    that lane over stopping or following. In LOCAL_SCENE_CONTEXT,
    observed_clear=false means that side is occupied. Never propose a lane change
    into a lane when available=false or observed_clear=false.
  provider: vertex
  action_speed_policy_mode: enforce
  # This is a per-run outbound-attempt cap, shared across the whole episode.
  maximum_requests_per_run: 10
  request_timeout_s: 10.0
  minimum_interval_s: 2.5
  action_horizon_s: 4.0
  max_scene_objects: 8
  maximum_frame_age_s: 0.5
  maximum_clock_skew_s: 0.05
  vertex:
    project_env: GOOGLE_CLOUD_PROJECT
    location: global
    model_id: gemini-3.5-flash-lite
    temperature: 0.0
    max_output_tokens: 256
    thinking_budget: 0

controller:
  target_speed_mps: 5.555555555555555

planner:
  route_source: map
  lookahead_m: 6.0
  waypoint_spacing_m: 2.0
  lane_change_enabled: true
  lane_change_transition_m: 18.0
  lane_change_timeout_s: 8.0
  lane_change_completion_tolerance_m: 0.6

perception:
  prefer_info: true
  safety_source: oracle
  detection_radius_m: 50.0
  corridor_margin_m: 0.5

safety:
  enabled: true
  headway_speed_cap_mode: enforce
  caution_ttc_s: 3.0
  emergency_ttc_s: 1.5
  minimum_gap_m: 3.0
  minimum_headway_s: 1.5
  reaction_time_s: 0.5
  maximum_deceleration_mps2: 6.0
  stale_after_s: 0.2
  release_hold_s: 0.3
  service_brake: 0.5

command_validation:
  minimum_confidence: 0.5
  maximum_command_age_s: 3.0
  maximum_clock_skew_s: 0.25
  scene_stale_after_s: 0.2
  maximum_target_speed_mps: 5.555555555555555
  slow_down_speed_mps: 4.166666666666667
  yield_speed_mps: 2.7777777777777777
  lane_change_front_gap_m: 12.0
  lane_change_rear_gap_m: 10.0
  lane_change_minimum_ttc_s: 3.0

scenario:
  stopped_vehicle_ahead_m: 28.0

event_log:
  enabled: true
  path: tmp/demo-vla-vertex-events.jsonl
  scenario_id: vertex-bounded-closed-loop
