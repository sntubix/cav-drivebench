# SmolVLM-256M-Instruct Q8_0 under the pinned llama-server, grammar-constrained.
# The Assignment 2 planning experiment in scripts/native-platform-check.sh
# (--smolvlm-model, --smolvlm-mmproj) serves it under this alias.

camera:
  enabled: true
  width: 512
  height: 288

vla:
  enabled: true
  prompt_policy: >-
    On a clear lane, prefer the cruise speed. Reduce target speed for visible
    hazards, uncertainty, road geometry, or traffic controls; use 0 only when a
    full stop is intended. Maintain safe forward progress. When
    LOCAL_SCENE_CONTEXT confirms that a stationary lead blocks the current lane
    and an adjacent lane is available and observed clear, prefer changing into
    that lane over stopping or following. In LOCAL_SCENE_CONTEXT,
    observed_clear=false means that side is occupied. Never propose a lane change
    into a lane when available=false or observed_clear=false.
  provider: http
  request_timeout_s: 60.0
  action_horizon_s: 3.0
  max_scene_objects: 8
  maximum_frame_age_s: 0.5
  maximum_clock_skew_s: 0.05
  http:
    endpoint_url: http://127.0.0.1:8000/v1/chat/completions
    model_id: drivebench-smolvlm-256m-q8-0
    api_key_env: null
    max_response_bytes: 1048576
    max_tokens: 512
    allow_insecure_http: false
    structured_output: true
    # Sampled, as Assignment 2 grading samples it: answers vary between runs, so
    # report live figures as the median and range over several runs.
    temperature: 0.7
