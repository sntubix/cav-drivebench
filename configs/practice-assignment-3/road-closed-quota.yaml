# Assignment 3 practice scene: barriers across all three lanes, 70 m ahead. There is no
# way past: the drive ends with the car at rest before them. This is the scene of
# road-closed.yaml again, with quota refusals from 8 s to the end of the drive, which
# begin on the approach to the barriers. Every request from then on is refused, and the
# car has to come to rest without the model. The drive passes when the car is at rest at
# the end, without a collision. Every request is billable, at most 105 a drive: load
# GOOGLE_CLOUD_PROJECT first. The timing is the hidden drives': a command holds for 4.0
# s, an answer more than 2.5 s old is refused, and the simulation runs at real time. The
# request withholds the objects and traffic lights, as in grading.
#
#   uv run metadrive-starter run --config configs/practice-assignment-3/road-closed-quota.yaml \
#     --submission submission --headless --event-log tmp/practice-road-closed-quota.jsonl
simulator:
  map: SSSC
  traffic_density: 0.0
  obstacle_probability: 0.0
  num_scenarios: 1
  start_seed: 102
  decision_repeat: 5
  horizon: 800
  use_lidar: true
  headless: true
  manual_control: false
  realtime: true
  realtime_factor: 1.0
  out_of_road_done: false
  crash_vehicle_done: false
  crash_object_done: false

camera:
  enabled: true
  width: 512
  height: 288

display:
  speed_unit: kph

vla:
  enabled: true
  prompt_policy: >-
    On a clear lane, prefer the cruise speed. Reduce target speed for visible
    hazards, uncertainty, road geometry, or traffic controls; use 0 only when a
    full stop is intended. Maintain safe forward progress. When the image shows
    a stationary vehicle blocking the current lane and LOCAL_SCENE_CONTEXT shows
    an adjacent lane available and observed clear, prefer changing into that
    lane over stopping or following. In LOCAL_SCENE_CONTEXT,
    observed_clear=false means that side is occupied. Never propose a lane
    change into a lane when available=false or observed_clear=false.
  provider: vertex
  action_speed_policy_mode: enforce
  maximum_requests_per_run: 105
  request_timeout_s: 6.0
  minimum_interval_s: 0.5
  action_horizon_s: 4.0
  max_scene_objects: 8
  maximum_frame_age_s: 0.5
  maximum_clock_skew_s: 0.05
  # Instructor-owned, as in grading: the model must find vehicles, cones and
  # barriers in the image. Your arbiter and request policy still receive the
  # whole measured scene.
  request_scene_fields:
    lanes: true
    lane_clearance: true
    traffic_controls: false
    objects: false
  vertex:
    project_env: GOOGLE_CLOUD_PROJECT
    location: global
    model_id: gemini-3.5-flash-lite
    temperature: 0.0
    max_output_tokens: 256
    thinking_budget: 0

controller:
  target_speed_mps: 5.555555555555555

planner:
  route_source: map
  lookahead_m: 6.0
  waypoint_spacing_m: 2.0
  lane_change_enabled: true
  lane_change_transition_m: 18.0
  lane_change_timeout_s: 8.0
  lane_change_completion_tolerance_m: 0.6

perception:
  prefer_info: true
  safety_source: oracle
  detection_radius_m: 50.0
  corridor_margin_m: 0.5

safety:
  enabled: true
  headway_speed_cap_mode: shadow
  caution_ttc_s: 3.0
  emergency_ttc_s: 1.5
  minimum_gap_m: 3.0
  minimum_headway_s: 1.5
  reaction_time_s: 0.5
  maximum_deceleration_mps2: 6.0
  stale_after_s: 0.2
  release_hold_s: 0.3
  service_brake: 0.5

command_validation:
  minimum_confidence: 0.5
  maximum_command_age_s: 2.5
  maximum_clock_skew_s: 0.25
  scene_stale_after_s: 0.2
  maximum_target_speed_mps: 5.555555555555555
  slow_down_speed_mps: 5.555555555555555
  yield_speed_mps: 2.7777777777777777
  lane_change_front_gap_m: 12.0
  lane_change_rear_gap_m: 10.0
  lane_change_minimum_ttc_s: 3.0

scenario:
  objects:
    - object_id: barrier-left
      distance_m: 70.0
      lane_offset: 0
      kind: barrier
    - object_id: barrier-middle
      distance_m: 70.0
      lane_offset: 1
      kind: barrier
    - object_id: barrier-right
      distance_m: 70.0
      lane_offset: 2
      kind: barrier

faults:
  - {fault_id: quota-1, kind: provider_quota, start_step: 80, duration_steps: 720}

event_log:
  enabled: true
  path: tmp/practice-road-closed-quota.jsonl
  scenario_id: practice-assignment-3-road-closed-quota
