# Assignment 3 practice scene: a truck stopped in your lane, 50 m ahead; a car moving at
# 3 m/s two lanes to the left, 40 m ahead; cones and a barrier closing the lane to your
# left from 140 to 155 m; and a car stopped in your starting lane, 230 m ahead. You
# start in the right lane of three. The drive passes when the car arrives without a
# collision. Every request is billable, at most 110 a drive: load GOOGLE_CLOUD_PROJECT
# first. The timing is the hidden drives': a command holds for 4.0 s, an answer more
# than 2.5 s old is refused, and the simulation runs at real time. The request withholds
# the objects and traffic lights, as in grading.
#
#   uv run metadrive-starter run --config configs/practice-assignment-3/mixed.yaml \
#     --submission submission --headless --event-log tmp/practice-mixed.jsonl
simulator:
  map: SSCSS
  traffic_density: 0.0
  obstacle_probability: 0.0
  num_scenarios: 1
  start_seed: 101
  decision_repeat: 5
  horizon: 1500
  use_lidar: true
  headless: true
  manual_control: false
  realtime: true
  realtime_factor: 1.0
  out_of_road_done: false
  crash_vehicle_done: false
  crash_object_done: false

camera:
  enabled: true
  width: 512
  height: 288

display:
  speed_unit: kph

vla:
  enabled: true
  prompt_policy: >-
    On a clear lane, prefer the cruise speed. Reduce target speed for visible
    hazards, uncertainty, road geometry, or traffic controls; use 0 only when a
    full stop is intended. Maintain safe forward progress. When the image shows
    a stationary vehicle blocking the current lane and LOCAL_SCENE_CONTEXT shows
    an adjacent lane available and observed clear, prefer changing into that
    lane over stopping or following. In LOCAL_SCENE_CONTEXT,
    observed_clear=false means that side is occupied. Never propose a lane
    change into a lane when available=false or observed_clear=false.
  provider: vertex
  action_speed_policy_mode: enforce
  maximum_requests_per_run: 110
  request_timeout_s: 6.0
  minimum_interval_s: 0.5
  action_horizon_s: 4.0
  max_scene_objects: 8
  maximum_frame_age_s: 0.5
  maximum_clock_skew_s: 0.05
  # Instructor-owned, as in grading: the model must find vehicles, cones and
  # barriers in the image. Your arbiter and request policy still receive the
  # whole measured scene.
  request_scene_fields:
    lanes: true
    lane_clearance: true
    traffic_controls: false
    objects: false
  vertex:
    project_env: GOOGLE_CLOUD_PROJECT
    location: global
    model_id: gemini-3.5-flash-lite
    temperature: 0.0
    max_output_tokens: 256
    thinking_budget: 0

controller:
  target_speed_mps: 5.555555555555555

planner:
  route_source: map
  lookahead_m: 6.0
  waypoint_spacing_m: 2.0
  lane_change_enabled: true
  lane_change_transition_m: 18.0
  lane_change_timeout_s: 8.0
  lane_change_completion_tolerance_m: 0.6

perception:
  prefer_info: true
  safety_source: oracle
  detection_radius_m: 50.0
  corridor_margin_m: 0.5

safety:
  enabled: true
  headway_speed_cap_mode: shadow
  caution_ttc_s: 3.0
  emergency_ttc_s: 1.5
  minimum_gap_m: 3.0
  minimum_headway_s: 1.5
  reaction_time_s: 0.5
  maximum_deceleration_mps2: 6.0
  stale_after_s: 0.2
  release_hold_s: 0.3
  service_brake: 0.5

command_validation:
  minimum_confidence: 0.5
  maximum_command_age_s: 2.5
  maximum_clock_skew_s: 0.25
  scene_stale_after_s: 0.2
  maximum_target_speed_mps: 5.555555555555555
  slow_down_speed_mps: 5.555555555555555
  yield_speed_mps: 2.7777777777777777
  lane_change_front_gap_m: 12.0
  lane_change_rear_gap_m: 10.0
  lane_change_minimum_ttc_s: 3.0

scenario:
  arrival_distance_m: 290.0
  stopped_vehicles:
    - vehicle_id: first-truck
      distance_m: 50.0
      kind: truck
    - vehicle_id: late-car
      distance_m: 230.0
      kind: car
  moving_vehicles:
    - vehicle_id: slow-far-left
      distance_m: 40.0
      speed_mps: 3.0
      lane_offset: -2
      kind: car
  objects:
    - object_id: works-cone0
      distance_m: 140.0
      lane_offset: -1
      kind: cone
    - object_id: works-cone1
      distance_m: 145.0
      lane_offset: -1
      kind: cone
    - object_id: works-cone2
      distance_m: 150.0
      lane_offset: -1
      kind: cone
    - object_id: works-barrier
      distance_m: 155.0
      lane_offset: -1
      kind: barrier

event_log:
  enabled: true
  path: tmp/practice-mixed.jsonl
  scenario_id: practice-assignment-3-mixed
