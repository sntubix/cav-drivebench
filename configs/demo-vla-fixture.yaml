simulator:
  map: XTOC
  traffic_density: 0.0
  obstacle_probability: 0.0
  horizon: 150
  headless: true
  manual_control: false
  realtime: false

camera:
  enabled: true
  width: 320
  height: 180

vla:
  enabled: true
  prompt_policy: >-
    On a clear lane, prefer the cruise speed. Reduce target speed for visible
    hazards, uncertainty, road geometry, or traffic controls; use 0 only when a
    full stop is intended. Maintain safe forward progress. When the image shows
    a stationary vehicle blocking the current lane and LOCAL_SCENE_CONTEXT shows
    an adjacent lane available and observed clear, prefer changing into that
    lane over stopping or following. In LOCAL_SCENE_CONTEXT,
    observed_clear=false means that side is occupied. Never propose a lane
    change into a lane when available=false or observed_clear=false.
  provider: fixture
  action_speed_policy_mode: enforce
  request_timeout_s: 1.0
  minimum_interval_s: 0.5
  action_horizon_s: 2.0
  # Assignment 2's observation gets no measured objects or traffic lights, so the
  # model must find them in the image; arbitration still sees the whole measured
  # scene (ADR-0008). Instructor-owned: agent.yaml cannot change it.
  request_scene_fields:
    lanes: true
    lane_clearance: true
    traffic_controls: false
    objects: false
  fixture:
    path: fixtures/vla/providers/synthetic-keep-lane.json
    repeat_last: true

# Assignment 2 drives with lane changes on, so a model's lane change to pass a
# stopped vehicle executes, under the floor's clearance checks, rather than
# falling back.
planner:
  lane_change_enabled: true

safety:
  enabled: true
  headway_speed_cap_mode: "off"

event_log:
  enabled: true
  path: tmp/demo-vla-fixture-events.jsonl
  scenario_id: synthetic-fixture-runtime-demo
