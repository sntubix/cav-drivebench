# Demos and plumbing checks only. MLX checkpoints are not the pinned model files,
# so figures from this profile do not predict Assignment 2's marks; do marked work
# on the pinned llama-server (docs/model-providers.md).
camera:
  enabled: true
  width: 512
  height: 288

vla:
  enabled: true
  prompt_policy: >-
    On a clear lane, prefer the cruise speed. Reduce target speed for visible
    hazards, uncertainty, road geometry, or traffic controls; use 0 only when a
    full stop is intended. Maintain safe forward progress. When the image shows
    a stationary vehicle blocking the current lane and LOCAL_SCENE_CONTEXT shows
    an adjacent lane available and observed clear, prefer changing into that
    lane over stopping or following. In LOCAL_SCENE_CONTEXT,
    observed_clear=false means that side is occupied. Never propose a lane
    change into a lane when available=false or observed_clear=false.
  request_timeout_s: 60.0
  action_horizon_s: 3.0
  max_scene_objects: 8
  maximum_frame_age_s: 0.5
  maximum_clock_skew_s: 0.05
  # Assignment 2's observation gets no measured objects or traffic lights, so the
  # model must find them in the image; arbitration still sees the whole measured
  # scene. Instructor-owned: agent.yaml cannot change it.
  request_scene_fields:
    lanes: true
    lane_clearance: true
    traffic_controls: false
    objects: false
  http:
    endpoint_url: http://127.0.0.1:8080/v1/chat/completions
    model_id: mlx-community/SmolVLM-256M-Instruct-4bit
    api_key_env: null
    max_response_bytes: 1048576
    max_tokens: 512
    allow_insecure_http: false
    # Sampled, as Assignment 2 grading samples it: answers vary between runs, so
    # report live figures as the median and range over several runs.
    temperature: 0.7
